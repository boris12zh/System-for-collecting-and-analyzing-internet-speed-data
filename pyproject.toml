[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-tracker"
version = "0.2.0"
description = "Personal Internet speed tracker: measure, store, analyze and export"
readme = "README.md"
requires-python = ">=3.12"
# The backend (database, statistics, export) uses only the standard library.
dependencies = []

[project.optional-dependencies]
ui = ["PySide6==6.8.3"]
measurement = ["speedtest-cli==2.1.3"]
# Backend checks; they need neither Qt nor the network.
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.0", "mypy==1.15.0"]
# UI tests (US06) need a Qt binding, so pytest-qt is kept separate from "dev".
ui-test = ["pytest-qt==4.4.0"]
build = ["pyinstaller==6.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.coverage.run]
source = ["speed_tracker"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["speed_tracker", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# PySide6 is optional and only imported lazily by the CLI entry point.
[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

