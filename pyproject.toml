[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-tracker"
version = "0.1.0"
description = "Personal Internet speed tracker - Python and SQLite foundation"
readme = "README.md"
requires-python = ">=3.12"
# No third-party packages are needed for the US03.1/US03.2 database backend.
dependencies = []

[project.optional-dependencies]
ui = ["PySide6==6.8.3"]
measurement = ["speedtest-cli==2.1.3"]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "pytest-qt==4.4.0", "ruff==0.11.0", "mypy==1.15.0"]
build = ["pyinstaller==6.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["speed_tracker"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

